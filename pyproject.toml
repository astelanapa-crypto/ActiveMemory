[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "active-memory-mcp"
version = "1.0.0"
description = "High-performance MCP server for knowledge management with PostgreSQL/pgvector, chunking, and hybrid search"
authors = [{name = "SilentStorm", email = "silentstorm@duckdns.org"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "mcp[cli,server]>=1.8.0",
    "httpx>=0.25.0",
    "psycopg[binary]>=3.1.18",
    "sqlalchemy>=2.0.25",
    "pgvector>=0.2.0",
    "redis>=5.0.0",
    "pydantic>=2.5.3",
    "python-dotenv>=1.0.0",
    "fastembed>=0.2.4",
    "numpy>=1.26.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.6",
    "PyPDF2>=3.0.1",
]

[project.scripts]
active-memory-mcp = "active_memory_mcp.main:main"
web-dashboard = "active_memory_mcp.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/active_memory_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
