  #     - ./models:/models
  #   command: >
  #     -m /models/bge-m3-q8_0.gguf
  #     --port 8899
  #     --embedding
  #     --pooling none
  #   ports:
  #     - "8899:8899"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
