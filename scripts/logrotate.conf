# Logrotate configuration for ActiveMemory
# Place this file at /etc/logrotate.d/active-memory

/path/to/ActiveMemory/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 silentstorm silentstorm
    sharedscripts
    postrotate
        # Reload services if needed
        systemctl reload active-memory-mcp 2>/dev/null || true
        systemctl reload active-memory-dashboard 2>/dev/null || true
    endscript
}
